[project]
name = "airflow-superglm-builder"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
  "joblib",
  "numpy",
  "openpyxl",
  "packaging",
  "pandas",
  "pyarrow>=23.0.1",
  "pydantic>=2.13,<3",
  "python-dotenv",
  "scikit-learn",
  "sqlalchemy",
  "superglm>=0.26,<0.27",
]

[project.optional-dependencies]
sqlserver = ["pyodbc"]
azure = ["azure-identity", "pyodbc"]
report = ["plotly>=6.9", "scipy"]
notebook = ["ipykernel"]
scratch = ["catboost", "lightgbm", "matplotlib", "scipy", "xgboost"]
mlflow = ["mlflow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricing_pipeline"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/pricing_pipeline",
  "/pyproject.toml",
  "/README.md",
]
exclude = [
  "/pricing_models",
  "/state",
  "/.venv",
  "/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
consider_namespace_packages = true

[tool.ruff]
target-version = "py314"
line-length = 100

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=9.0.3",
    "PyYAML",
    "ruff",
    "sqlfluff>=4.2.1",
]
